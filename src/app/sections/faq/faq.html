<section class="section faq" id="faq">
  <div class="container faq__layout">
    <header class="faq__head">
      <p class="sec-head__index">06 — Questions</p>
      <h2 class="display-l">The things people<br />actually ask.</h2>
      <p class="faq__note">
        Still unsure? <a href="#cta">Talk to a human</a> — we reply within one working day.
      </p>
    </header>

    <div class="faq__list" vReveal>
      @for (f of faqs; track f.q; let i = $index) {
        <div class="faq__item" [class.is-open]="open() === i">
          <button
            class="faq__q"
            (click)="toggle(i)"
            [attr.aria-expanded]="open() === i"
            [attr.aria-controls]="'faq-panel-' + i"
          >
            <span>{{ f.q }}</span>
            <span class="faq__icon"><app-icon name="arrow" [size]="15" /></span>
          </button>
          <div class="faq__a" [id]="'faq-panel-' + i">
            <p>{{ f.a }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
