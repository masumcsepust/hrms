name: Hana HRM — build, verify and deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build_and_verify:
    runs-on: ubuntu-latest
    name: Build and verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the calculation engine
        # 44 assertions taken from the SRS worked examples — delay, overtime,
        # earned leave, tenure and the sandwich leave rule.
        run: npm run verify

      - name: Production build
        # GitHub Pages serves the app from https://<owner>.github.io/hrms/
        run: ng build --configuration production --base-href /hrms/

      - name: Add the SPA fallback for deep links
        run: npm run postbuild:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/hrms/browser

  deploy_github_pages:
    needs: build_and_verify
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy_azure_static_web_apps:
    needs: build_and_verify
    # The Azure Static Web App behind this repository is no longer provisioned
    # (the deployment token is rejected by the content server). The job is kept
    # so that a re-provisioned Static Web App is picked up automatically — it
    # does not fail the workflow while the target is missing.
    continue-on-error: true
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Deploy to Azure Static Web Apps
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_GLACIER_04B3C0600 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          # the Angular 20 build writes to dist/hrms/browser — keep this in sync
          # with the "Output location" of the Azure Static Web App.
          output_location: "dist/hrms/browser"
